<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vrutti Code Editor</title>
    <link rel="stylesheet" href="styles/index.css">
</head>
<body>
    <div id="app">
        <!-- Greeting Screen -->
        <div id="greeting-screen">
            <h1>Welcome to Vrutti</h1>
            <button id="open-file-btn" onclick="openFile()">Open File</button>
        <button id="open-folder-btn" onclick="openFolder()">Open Folder</button>
        </div>       

        <!-- Editor Section -->
        <div id="editor-container">
            <!-- Tab content will be displayed here -->
        </div>
    </div>

    <!-- Link the Explorer Modal HTML and Scripts -->
    <script src="components/explorer.js" defer></script>
    <script src="components/tabs.js" defer></script>
    <script src="renderer.js" defer></script>

</body>
</html>
