<div id="explorer-modal">
    <div id="explorer-container">
        <h2>Select a File or Folder</h2>
        <button id="close-explorer-btn">Close</button>
        
        <div id="file-list">
            <!-- File and Folder List will appear here -->
        </div>
        
        <button id="open-file-btn" onclick="openFile()">Open File</button>
        <button id="open-folder-btn" onclick="openFolder()">Open Folder</button>
    </div>
</div>
